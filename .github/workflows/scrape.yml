name: scrape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: timeout 330m python src/scraping/scrape_ufc.py || true

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/events_index.json
            data/fights.json
            data/fighters_cache.json
          if-no-files-found: warn

      - name: Push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events_index.json data/fights.json data/fighters_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: update scraped data"
          git push
