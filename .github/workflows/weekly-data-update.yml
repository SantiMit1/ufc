name: weekly-data-update

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install chromium --with-deps

      - name: Run data pipeline (event index -> scrape new events -> features)
        run: timeout 330m ufc pipeline --skip-train || true

      - name: Get last scraped event
        id: last_event
        if: always()
        run: |
          python -c "import json, os; idx=json.load(open('data/events_index.json')); s=[e for e in idx if e.get('scrapped')]; name=s[-1]['name'] if s else 'no new events'; open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write(f'name={name}\n'); print(name)"

      - name: Push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events_index.json data/fights.json data/fighters_cache.json data/dataset.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: ${{ steps.last_event.outputs.name }}"
          git push
